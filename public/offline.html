<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — TBC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #C41E3A 0%, #8f1128 100%);
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 420px; }
    .logo {
      width: 96px; height: 96px;
      border-radius: 50%;
      background: #fff;
      margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.25);
    }
    .logo img { width: 82px; height: 82px; border-radius: 50%; }
    h1 { font-size: 26px; margin-bottom: 10px; }
    p { opacity: .92; line-height: 1.6; font-size: 15px; margin-bottom: 28px; }
    button {
      background: #fff; color: #C41E3A;
      border: none; border-radius: 999px;
      padding: 14px 36px;
      font-size: 16px; font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
    }
    button:active { transform: scale(.97); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="/tbc-logo.png" alt="TBC" /></div>
    <h1>You are offline</h1>
    <p>Check your internet connection and try again.<br />
    आपका इंटरनेट बंद है — कृपया कनेक्शन जांचें और दोबारा कोशिश करें।</p>
    <button onclick="location.reload()">Retry / फिर कोशिश करें</button>
  </div>
</body>
</html>
